<script>
  const header = document.getElementById('main-header');
  const menuBtn = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');
  const menuOverlay = document.getElementById('menu-overlay');

  // ✅ Toggle mobile menu open/close
  menuBtn.addEventListener('click', () => {
    const menuIsHidden = mobileMenu.classList.contains('translate-x-full');

    if (menuIsHidden) {
      // --- OPEN MENU ---
      mobileMenu.classList.remove('translate-x-full');
      menuOverlay.classList.remove('hidden');
      menuBtn.setAttribute('aria-expanded', 'true');
      document.body.classList.add('overflow-hidden');
      menuBtn.classList.remove('text-white');
      menuBtn.classList.add('text-black');
    } else {
      // --- CLOSE MENU ---
      mobileMenu.classList.add('translate-x-full');
      menuOverlay.classList.add('hidden');
      menuBtn.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('overflow-hidden');
      menuBtn.classList.remove('text-black');
      menuBtn.classList.add('text-white');
    }
  });

  // ✅ Close when clicking overlay or a link
  const closeMenu = () => {
    mobileMenu.classList.add('translate-x-full');
    menuOverlay.classList.add('hidden');
    menuBtn.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('overflow-hidden');
    menuBtn.classList.remove('text-black');
    menuBtn.classList.add('text-white');
  };

  menuOverlay.addEventListener('click', closeMenu);
  document.querySelectorAll('#mobile-menu a').forEach(link =>
    link.addEventListener('click', closeMenu)
  );

  // ✅ Hide header on scroll down, show on scroll up
  let lastScroll = 0;
  window.addEventListener('scroll', () => {
    const currentScroll = window.pageYOffset;
    if (currentScroll <= 0) {
      header.classList.remove('-translate-y-full');
      return;
    }

    if (currentScroll > lastScroll && !header.classList.contains('-translate-y-full')) {
      // scrolling down
      header.classList.add('-translate-y-full');
    } else if (currentScroll < lastScroll && header.classList.contains('-translate-y-full')) {
      // scrolling up
      header.classList.remove('-translate-y-full');
    }
    lastScroll = currentScroll;
  });

  // ✅ Back-to-top button behavior
  const backToTop = document.createElement('button');
  backToTop.innerHTML = '↑';
  backToTop.id = 'back-to-top';
  backToTop.className =
    'fixed bottom-6 right-6 bg-accent-green text-white text-xl rounded-full w-12 h-12 flex items-center justify-center shadow-lg opacity-0 pointer-events-none transition-all duration-300 hover:scale-110';
  document.body.appendChild(backToTop);

  window.addEventListener('scroll', () => {
    if (window.scrollY > window.innerHeight / 2) {
      backToTop.classList.remove('opacity-0', 'pointer-events-none');
      backToTop.classList.add('opacity-100');
    } else {
      backToTop.classList.add('opacity-0', 'pointer-events-none');
      backToTop.classList.remove('opacity-100');
    }
  });

  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
